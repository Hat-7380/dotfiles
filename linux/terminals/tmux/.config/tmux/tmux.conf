# --- Basics ---
set -g mouse on                      # click panes, scroll, drag borders
set -g history-limit 50000           # more scrollback
set -g escape-time 10                # no lag after pressing Esc (nvim)
set -g focus-events on
set -g default-shell /usr/bin/zsh    # panes open zsh, not the login shell (bash)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB"  # true colors

# --- Prefix: Ctrl+A instead of Ctrl+b ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Numbering starts at 1, closes leave no gaps ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- New panes/windows open in the current folder ---
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# --- Move between panes: prefix + h/j/k/l, or Alt + arrows ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Switch windows: Shift + left/right ---
bind -n S-Left  previous-window
bind -n S-Right next-window

# --- Copy mode with vim keys, copies to the system clipboard ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# --- Reload config: prefix + r ---
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
